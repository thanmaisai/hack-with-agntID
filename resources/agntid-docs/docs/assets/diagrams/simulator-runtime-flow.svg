<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc" font-family="'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif">
  <title id="title">How a Simulator request is protected</title>
  <desc id="desc">The portal starts a secure simulation session. The customer runtime asks the AI model to choose a visible tool, checks policy, and either runs or blocks the MCP tool.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="390" rx="18" fill="#f8fafc"/>
  <rect x="34" y="54" width="260" height="282" rx="16" fill="#fff" stroke="#6366f1" stroke-width="2"/><text x="164" y="88" text-anchor="middle" font-size="18" font-weight="700" fill="#312e81">AgntID portal</text>
  <g fill="#eef2ff" stroke="#a5b4fc"><rect x="62" y="112" width="204" height="52" rx="10"/><rect x="62" y="182" width="204" height="52" rx="10"/><rect x="62" y="252" width="204" height="52" rx="10"/></g>
  <g fill="#3730a3" text-anchor="middle" font-size="14"><text x="164" y="143">Choose runtime + model</text><text x="164" y="213">Send plain-English request</text><text x="164" y="283">Show result + evidence</text></g>
  <rect x="416" y="36" width="430" height="318" rx="16" fill="#fff" stroke="#0d9488" stroke-width="2"/><text x="631" y="70" text-anchor="middle" font-size="18" font-weight="700" fill="#0f766e">Customer runtime</text>
  <g fill="#f0fdfa" stroke="#5eead4"><rect x="452" y="96" width="358" height="50" rx="10"/><rect x="452" y="166" width="358" height="50" rx="10"/><rect x="452" y="236" width="358" height="50" rx="10"/></g>
  <g fill="#134e4a" text-anchor="middle"><text x="631" y="118" font-size="15" font-weight="700">1. Offer profile-visible tools</text><text x="631" y="137" font-size="12">the model chooses a tool and inputs</text><text x="631" y="188" font-size="15" font-weight="700">2. Check the effective policy</text><text x="631" y="207" font-size="12">allow or deny before execution</text><text x="631" y="258" font-size="15" font-weight="700">3. Record the outcome</text><text x="631" y="277" font-size="12">result, logs, flow, audit, metrics</text></g>
  <rect x="940" y="65" width="222" height="100" rx="14" fill="#fff" stroke="#8b5cf6" stroke-width="2"/><text x="1051" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#6d28d9">AI provider</text><text x="1051" y="126" text-anchor="middle" font-size="13" fill="#4c1d95">selects a visible tool</text><text x="1051" y="146" text-anchor="middle" font-size="13" fill="#4c1d95">and forms the response</text>
  <rect x="940" y="225" width="222" height="100" rx="14" fill="#fff" stroke="#f59e0b" stroke-width="2"/><text x="1051" y="260" text-anchor="middle" font-size="17" font-weight="700" fill="#92400e">MCP servers</text><text x="1051" y="286" text-anchor="middle" font-size="13" fill="#78350f">built-in or customer tools</text><text x="1051" y="306" text-anchor="middle" font-size="13" fill="#78350f">run only after ALLOW</text>
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M294 195h118"/><path d="M846 121h90"/><path d="M936 145h-86"/><path d="M846 275h90"/></g>
  <text x="353" y="184" text-anchor="middle" font-size="12" fill="#475569">secure session</text><text x="891" y="108" text-anchor="middle" font-size="12" fill="#475569">request</text><text x="891" y="164" text-anchor="middle" font-size="12" fill="#475569">choice</text><text x="891" y="262" text-anchor="middle" font-size="12" fill="#475569">ALLOW</text>
</svg>
