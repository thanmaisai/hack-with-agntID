<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc" font-family="'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif">
  <title id="title">MCP server-to-client journey</title>
  <desc id="desc">An administrator adds and tests an MCP server in the portal. The runtime discovers tools, applies the protection profile and policies, sends a filtered tool list to MCP clients, and records access results.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="390" rx="18" fill="#f8fafc"/>
  <text x="36" y="34" font-size="13" font-weight="700" fill="#0f766e">SET UP ONCE</text>
  <g fill="#fff" stroke="#0d9488" stroke-width="2">
    <rect x="36" y="54" width="210" height="92" rx="14"/><rect x="286" y="54" width="210" height="92" rx="14"/><rect x="536" y="54" width="260" height="92" rx="14"/><rect x="836" y="54" width="328" height="92" rx="14"/>
  </g>
  <g fill="#0f172a" text-anchor="middle">
    <text x="141" y="86" font-size="16" font-weight="700">Choose a server</text><text x="141" y="110" font-size="12">HTTP · npx · uvx · Docker</text><text x="141" y="129" font-size="12">command · service connector</text>
    <text x="391" y="86" font-size="16" font-weight="700">Add in the portal</text><text x="391" y="110" font-size="12">test, save, and apply</text>
    <text x="666" y="86" font-size="16" font-weight="700">Discover and review</text><text x="666" y="110" font-size="12">classify each tool action</text>
    <text x="1000" y="86" font-size="16" font-weight="700">Build the available tool list</text><text x="1000" y="110" font-size="12">protection profile + tool state + role</text>
  </g>
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M246 100h36"/><path d="M496 100h36"/><path d="M796 100h36"/></g>
  <text x="36" y="205" font-size="13" font-weight="700" fill="#6d28d9">USE EVERY DAY</text>
  <rect x="36" y="225" width="330" height="120" rx="16" fill="#fff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="201" y="258" text-anchor="middle" font-size="17" font-weight="700" fill="#5b21b6">MCP clients</text>
  <g fill="#f5f3ff" stroke="#c4b5fd"><rect x="62" y="278" width="82" height="42" rx="9"/><rect x="160" y="278" width="82" height="42" rx="9"/><rect x="258" y="278" width="82" height="42" rx="9"/></g>
  <g fill="#4c1d95" text-anchor="middle" font-size="13" font-weight="600"><text x="103" y="304">Cursor</text><text x="201" y="304">Claude</text><text x="299" y="304">Codex</text></g>
  <rect x="444" y="205" width="330" height="160" rx="16" fill="#fff" stroke="#0d9488" stroke-width="2"/>
  <text x="609" y="238" text-anchor="middle" font-size="17" font-weight="700" fill="#0f766e">Customer-hosted runtime</text>
  <g fill="#f0fdfa" stroke="#5eead4"><rect x="476" y="258" width="266" height="38" rx="9"/><rect x="476" y="310" width="266" height="38" rx="9"/></g>
  <g fill="#134e4a" text-anchor="middle" font-size="13" font-weight="600"><text x="609" y="282">show only available tools</text><text x="609" y="334">check policy before each call</text></g>
  <rect x="852" y="225" width="312" height="120" rx="16" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
  <text x="1008" y="260" text-anchor="middle" font-size="17" font-weight="700" fill="#92400e">Results and evidence</text>
  <text x="1008" y="289" text-anchor="middle" font-size="13" fill="#78350f">MCP Access Dashboard</text><text x="1008" y="314" text-anchor="middle" font-size="13" fill="#78350f">Reporting and audit events</text>
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M366 285h74"/><path d="M778 285h70"/></g>
</svg>
