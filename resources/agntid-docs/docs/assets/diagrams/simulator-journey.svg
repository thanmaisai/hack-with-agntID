<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc" font-family="'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif">
  <title id="title">Simulator test journey</title>
  <desc id="desc">Prepare a runtime, connect the Simulator, send a request, then follow an allowed or denied path and review the evidence.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="300" rx="18" fill="#f8fafc"/>
  <text x="36" y="36" font-size="13" font-weight="700" fill="#0f766e">SIMULATOR TEST</text>
  <g fill="#fff" stroke="#0d9488" stroke-width="2"><rect x="36" y="60" width="190" height="82" rx="12"/><rect x="278" y="60" width="190" height="82" rx="12"/><rect x="520" y="60" width="190" height="82" rx="12"/></g>
  <g fill="#0f172a" text-anchor="middle"><text x="131" y="94" font-size="17" font-weight="700">Prepare</text><text x="131" y="119" font-size="13">runtime + credential</text><text x="373" y="94" font-size="17" font-weight="700">Connect</text><text x="373" y="119" font-size="13">start a session</text><text x="615" y="94" font-size="17" font-weight="700">Send a request</text><text x="615" y="119" font-size="13">plain English</text></g>
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M226 101h48"/><path d="M468 101h48"/><path d="M710 101h68"/></g>
  <path d="M778 101h42v-35h44" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M778 101h42v84h44" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="868" y="34" width="190" height="70" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><rect x="868" y="150" width="190" height="70" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="963" y="66" text-anchor="middle" font-size="17" font-weight="700" fill="#065f46">Allowed</text><text x="963" y="88" text-anchor="middle" font-size="13" fill="#065f46">tool runs</text><text x="963" y="182" text-anchor="middle" font-size="17" font-weight="700" fill="#9a3412">Denied</text><text x="963" y="204" text-anchor="middle" font-size="13" fill="#9a3412">tool is blocked</text>
  <path d="M1058 69h62v79" stroke="#64748b" stroke-width="2" fill="none"/><path d="M1058 185h62v-37" stroke="#64748b" stroke-width="2" fill="none"/><path d="M1120 148v47" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="1025" y="226" width="150" height="52" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="1100" y="248" text-anchor="middle" font-size="15" font-weight="700" fill="#3730a3">Review</text><text x="1100" y="267" text-anchor="middle" font-size="12" fill="#3730a3">result + evidence</text>
</svg>
