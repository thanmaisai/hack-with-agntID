<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc" font-family="'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif">
  <title id="title">OAuth access from AWS AgentCore to AgntID tools</title>
  <desc id="desc">The user signs in through the reference portal. The portal refreshes the OAuth token and invokes AgentCore. AgentCore lists or calls tools through the AgntID runtime. The runtime filters tools, checks calls, forwards allowed work to MCP servers, and records reporting events.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#94a3b8"/></marker><marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#4ade80"/></marker></defs>
  <rect width="1200" height="430" rx="18" fill="#0f172a"/><text x="40" y="36" font-size="12" font-weight="700" fill="#5eead4">SIGNED-IN REQUEST</text>
  <g fill="#1e293b" stroke-width="2"><rect x="40" y="58" width="185" height="94" rx="15" stroke="#2dd4bf"/><rect x="275" y="58" width="210" height="94" rx="15" stroke="#2dd4bf"/><rect x="535" y="58" width="218" height="94" rx="15" stroke="#fbbf24"/><rect x="803" y="58" width="214" height="190" rx="16" stroke="#4ade80"/><rect x="803" y="294" width="214" height="84" rx="15" stroke="#a78bfa"/><rect x="1053" y="104" width="112" height="96" rx="15" stroke="#fbbf24"/></g>
  <text x="132" y="94" text-anchor="middle" font-size="17" font-weight="700" fill="#ccfbf1">User</text><text x="132" y="121" text-anchor="middle" font-size="13" fill="#cbd5e1">prompt + sign-in</text>
  <text x="380" y="91" text-anchor="middle" font-size="17" font-weight="700" fill="#ccfbf1">Reference portal</text><text x="380" y="116" text-anchor="middle" font-size="13" fill="#cbd5e1">keeps and refreshes</text><text x="380" y="135" text-anchor="middle" font-size="13" fill="#cbd5e1">OAuth access</text>
  <text x="644" y="91" text-anchor="middle" font-size="17" font-weight="700" fill="#fde68a">AWS AgentCore</text><text x="644" y="116" text-anchor="middle" font-size="13" fill="#cbd5e1">local or deployed agent</text><text x="644" y="135" text-anchor="middle" font-size="13" fill="#cbd5e1">selects a visible tool</text>
  <text x="910" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#bbf7d0">AgntID runtime</text><g fill="#14532d" stroke="#22c55e"><rect x="830" y="113" width="160" height="36" rx="8"/><rect x="830" y="160" width="160" height="36" rx="8"/><rect x="830" y="207" width="160" height="36" rx="8"/></g><g text-anchor="middle" font-size="12" font-weight="600" fill="#f0fdf4"><text x="910" y="136">filter tools by profile</text><text x="910" y="183">check call inputs</text><text x="910" y="230">record the outcome</text></g>
  <text x="910" y="329" text-anchor="middle" font-size="17" font-weight="700" fill="#ddd6fe">MCP servers</text><text x="910" y="354" text-anchor="middle" font-size="13" fill="#c4b5fd">allowed calls only</text><text x="1109" y="141" text-anchor="middle" font-size="16" font-weight="700" fill="#fde68a">Reporting</text><text x="1109" y="166" text-anchor="middle" font-size="12" fill="#fef3c7">allow or deny</text>
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M225 105h46"/><path d="M485 105h46"/><path d="M753 105h46"/><path d="M1017 151h32"/><path d="M910 248v42"/></g><path d="M535 139c-32 62-226 70-255 17" stroke="#4ade80" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/><text x="405" y="195" text-anchor="middle" font-size="12" font-weight="600" fill="#86efac">answer + tool trace</text>
  <text x="40" y="406" font-size="13" fill="#cbd5e1">The OAuth token carries user access. The protection profile and runtime policy decide which tools are visible and which calls may run.</text>
</svg>
