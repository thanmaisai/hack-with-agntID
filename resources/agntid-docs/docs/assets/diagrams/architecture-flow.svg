<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc" font-family="'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif">
  <title id="title">How AgntID protects tool calls</title>
  <desc id="desc">The portal synchronizes profiles and policies and provides an Inspector tunnel and reporting. The customer runtime filters tools and enforces calls before built-in or customer MCP servers.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
  <rect width="1100" height="390" rx="16" fill="#f8fafc"/>
  <rect x="30" y="40" width="300" height="270" rx="14" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
  <text x="180" y="74" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">AgntID portal</text>
  <g fill="#ecfeff" stroke="#14b8a6"><rect x="65" y="98" width="230" height="46" rx="8"/><rect x="65" y="160" width="230" height="58" rx="8"/><rect x="65" y="234" width="230" height="46" rx="8"/></g>
  <g text-anchor="middle" fill="#134e4a" font-size="13"><text x="180" y="126">Protection profile</text><text x="180" y="184">Baseline + tool-specific</text><text x="180" y="202">policies</text><text x="180" y="262">Reporting</text></g>
  <rect x="400" y="86" width="250" height="178" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="525" y="119" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Secure connection</text>
  <text x="525" y="154" text-anchor="middle" font-size="13" fill="#334155">Signed synchronization</text>
  <path d="M430 174H620" stroke="#94a3b8" stroke-width="1"/>
  <text x="525" y="207" text-anchor="middle" font-size="13" fill="#334155">Inspector tunnel</text>
  <text x="525" y="230" text-anchor="middle" font-size="12" fill="#64748b">No inbound runtime port</text>
  <rect x="720" y="40" width="350" height="270" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="895" y="74" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Customer runtime</text>
  <g fill="#eff6ff" stroke="#3b82f6"><rect x="765" y="106" width="260" height="54" rx="8"/><rect x="765" y="190" width="260" height="54" rx="8"/></g>
  <g text-anchor="middle" fill="#1e3a8a" font-size="14" font-weight="600"><text x="895" y="138">Profile filters the tool list</text><text x="895" y="222">Local policy checks</text></g>
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M330 140H396"/><path d="M650 140H716"/><path d="M716 230H654"/><path d="M400 230H334"/><path d="M895 310V338"/></g>
  <rect x="720" y="342" width="350" height="38" rx="9" fill="#f8fafc" stroke="#64748b"/>
  <text x="895" y="366" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">Built-in and customer MCP servers</text>
  <text x="367" y="128" text-anchor="middle" font-size="11" fill="#475569">control</text><text x="684" y="128" text-anchor="middle" font-size="11" fill="#475569">sync</text>
  <text x="684" y="252" text-anchor="middle" font-size="11" fill="#475569">events</text><text x="367" y="252" text-anchor="middle" font-size="11" fill="#475569">report</text>
</svg>
