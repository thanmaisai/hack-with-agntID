<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc" font-family="'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif">
  <title id="title">AgntID application integration paths</title>
  <desc id="desc">An application can use the core Python SDK, Microsoft Semantic Kernel, LangChain and Deep Agents, or the OAuth-enabled AWS AgentCore integration. Each path reaches the AgntID runtime, which filters tools, checks calls, forwards allowed calls to MCP servers, and records reporting evidence.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="480" rx="18" fill="#f8fafc"/>
  <rect x="36" y="42" width="214" height="96" rx="15" fill="#fff" stroke="#16a34a" stroke-width="2"/><text x="143" y="78" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">Your application</text><text x="143" y="106" text-anchor="middle" font-size="13" fill="#475569">trusted agent + user identity</text>
  <text x="300" y="31" font-size="12" font-weight="700" fill="#0f766e">CHOOSE ONE INTEGRATION</text>
  <g fill="#fff" stroke="#0d9488" stroke-width="2"><rect x="300" y="44" width="236" height="66" rx="13"/><rect x="300" y="126" width="236" height="66" rx="13"/><rect x="300" y="208" width="236" height="76" rx="13"/><rect x="300" y="300" width="236" height="76" rx="13"/></g>
  <g text-anchor="middle" fill="#134e4a"><text x="418" y="72" font-size="16" font-weight="700">Core Python SDK</text><text x="418" y="94" font-size="12">your code selects tools</text><text x="418" y="154" font-size="16" font-weight="700">Semantic Kernel</text><text x="418" y="176" font-size="12">plugin + ChatCompletionAgent</text><text x="418" y="238" font-size="16" font-weight="700">LangChain / Deep Agents</text><text x="418" y="260" font-size="12">agent, plan, and delegation bridge</text><text x="418" y="330" font-size="16" font-weight="700">AWS AgentCore</text><text x="418" y="352" font-size="12">OAuth + protected MCP tools</text></g>
  <rect x="598" y="76" width="250" height="252" rx="16" fill="#fff" stroke="#22c55e" stroke-width="2"/><text x="723" y="111" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">AgntID runtime</text>
  <g fill="#f0fdf4" stroke="#86efac"><rect x="628" y="136" width="190" height="42" rx="9"/><rect x="628" y="191" width="190" height="42" rx="9"/><rect x="628" y="246" width="190" height="42" rx="9"/></g><g text-anchor="middle" font-size="13" font-weight="600" fill="#14532d"><text x="723" y="162">filter the tool list</text><text x="723" y="217">check every call</text><text x="723" y="272">record the outcome</text></g>
  <rect x="920" y="60" width="244" height="112" rx="15" fill="#fff" stroke="#8b5cf6" stroke-width="2"/><text x="1042" y="94" text-anchor="middle" font-size="17" font-weight="700" fill="#5b21b6">MCP tool servers</text><text x="1042" y="121" text-anchor="middle" font-size="13" fill="#6d28d9">built-in and customer tools</text><text x="1042" y="144" text-anchor="middle" font-size="13" fill="#6d28d9">allowed calls only</text>
  <rect x="920" y="230" width="244" height="88" rx="15" fill="#fff" stroke="#f59e0b" stroke-width="2"/><text x="1042" y="265" text-anchor="middle" font-size="17" font-weight="700" fill="#92400e">Reporting</text><text x="1042" y="292" text-anchor="middle" font-size="13" fill="#78350f">allow, deny, and correlation</text>
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M250 90h46"/><path d="M250 90c28 0 22 69 46 69"/><path d="M250 90c28 0 22 156 46 156"/><path d="M250 90c28 0 22 248 46 248"/><path d="M536 77h58"/><path d="M536 159h58"/><path d="M536 246h58"/><path d="M536 338h58"/><path d="M848 132h68"/><path d="M848 274h68"/></g>
  <text x="36" y="444" font-size="13" fill="#475569">The framework or agent selects a tool. The runtime remains the enforcement point for visibility, policy, execution, and evidence.</text>
</svg>
